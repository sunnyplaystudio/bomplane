<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Uçak Oyunu</title>

<style>
body { margin:0; overflow:hidden; background:#87CEEB; font-family:Arial; touch-action:none;}
canvas { display:block; }

#scoreboard {
 position:absolute;
 top:10px;
 right:10px;
 font-size:5vw;
 font-weight:bold;
 color:white;
 text-shadow:2px 2px 4px black;
}

#controls {
 position:absolute;
 top:10px;
 left:10px;
}

button {
 font-size:3.2vw;
 padding:1.8vw;
 border-radius:8px;
 border:none;
 background:#007BFF;
 color:white;
 margin-right:5px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="scoreboard">Skor: 0 | Rekor: 0</div>

<div id="controls">
<button onclick="startGame()">▶️</button>
<button onclick="pauseGame()">⏸️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
 canvas.width = window.innerWidth;
 canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// 🔊 SES
const shootSound = new Audio("shoot.mp3");
const explosionSound = new Audio("explosion.mp3");
const engineSound = new Audio("engine.mp3");

engineSound.loop = true;
engineSound.volume = 0.2;

// mobil ses fix
function unlockAudio(){
 shootSound.play().then(()=>shootSound.pause()).catch(()=>{});
 explosionSound.play().then(()=>explosionSound.pause()).catch(()=>{});
 engineSound.play().then(()=>engineSound.pause()).catch(()=>{});
}
document.addEventListener("click", unlockAudio, {once:true});
document.addEventListener("touchstart", unlockAudio, {once:true});

// 🛩️ oyuncu
let playerReady = false;
const playerImg = new Image();
playerImg.src = "fighter.png?v=2";
playerImg.onload = ()=> playerReady = true;

// OYUN
let plane={x:canvas.width/2,y:canvas.height-120};
let bullets=[], enemies=[], clouds=[], scoreTexts=[];
let score=0, highScore=localStorage.getItem("highScore")||0;
let running=false;

// restart
function restartGame(){
 bullets=[]; enemies=[]; clouds=[]; scoreTexts=[];
 score=0;
 plane.x=canvas.width/2;
 running=true;
}

// 🎮 KLAVYE
let keys={};

document.addEventListener("keydown",e=>{
 keys[e.key]=true;

 if(e.key===" " && running){
  bullets.push({x:plane.x,y:plane.y});
  playShoot();
 }
});

document.addEventListener("keyup",e=>{
 keys[e.key]=false;
});

// 📱 TOUCH
canvas.addEventListener("touchmove",e=>{
 let x=e.touches[0].clientX;
 plane.x=Math.max(40,Math.min(canvas.width-40,x));
});

canvas.addEventListener("touchstart",()=>{
 if(running){
  bullets.push({x:plane.x,y:plane.y});
  playShoot();
 }
});

// 🖱️ MOUSE (PC fix)
canvas.addEventListener("mousemove",e=>{
 plane.x=Math.max(40,Math.min(canvas.width-40,e.clientX));
});

// SES
function playShoot(){
 shootSound.currentTime=0;
 shootSound.play().catch(()=>{});
}

function playExplosion(){
 explosionSound.currentTime=0;
 explosionSound.play().catch(()=>{});
}

// 🎈 + diğer nesneler
setInterval(()=>{
 if(running){
  let types=[
   {emoji:"🎈",p:10},
   {emoji:"✈️",p:10},
   {emoji:"🛸",p:15},
   {emoji:"🚗",p:5},
   {emoji:"🛢️",p:5}
  ];
  let t=types[Math.random()*types.length|0];
  enemies.push({x:Math.random()*canvas.width,y:-40,type:t.emoji,p:t.p});
 }
},1000);

// bulutlar
setInterval(()=>{
 if(running) clouds.push({x:Math.random()*canvas.width,y:-40});
},1500);

// HIT
function hit(a,b){
 return Math.abs(a.x-b.x)<40 && Math.abs(a.y-b.y)<40;
}

// UPDATE
function update(){
 if(!running) return;

 if(keys["ArrowLeft"]) plane.x-=8;
 if(keys["ArrowRight"]) plane.x+=8;

 plane.x=Math.max(40,Math.min(canvas.width-40,plane.x));

 bullets.forEach(b=>b.y-=10);

 // ⚡ hız sistemi
 let speedBoost = Math.floor(score/1000)*0.5;

 enemies.forEach(e=>e.y+=2+speedBoost);
 clouds.forEach(c=>c.y+=1+speedBoost*0.5);

 enemies.forEach((e,ei)=>{
  bullets.forEach((b,bi)=>{
   if(hit(b,e)){
    score+=e.p;
    scoreTexts.push({x:e.x,y:e.y,text:"+"+e.p+" 💰",life:30});
    enemies.splice(ei,1);
    bullets.splice(bi,1);
    playExplosion();
   }
  });

  if(hit(plane,e)){
    running=false;
    engineSound.pause();
    setTimeout(()=>{
     alert("GAME OVER 😎 Skor: "+score);
     restartGame();
    },100);
  }
 });

 if(score>highScore){
  highScore=score;
  localStorage.setItem("highScore",highScore);
 }

 document.getElementById("scoreboard").innerText=
 "Skor: "+score+" | Rekor: "+highScore;
}

// DRAW
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.font=(canvas.width/12)+"px Arial";

 clouds.forEach(c=>ctx.fillText("☁️",c.x,c.y));

 if(playerReady){
  ctx.drawImage(playerImg, plane.x-40, plane.y-40, 80, 80);
 }else{
  ctx.fillText("🛩️",plane.x,plane.y);
 }

 bullets.forEach(b=>ctx.fillText("🔥",b.x,b.y));
 enemies.forEach(e=>ctx.fillText(e.type,e.x,e.y));

 scoreTexts.forEach((t,i)=>{
  ctx.fillStyle="gold";
  ctx.font=(canvas.width/18)+"px Arial";
  ctx.fillText(t.text,t.x,t.y);
  t.y--;
  t.life--;
  if(t.life<=0) scoreTexts.splice(i,1);
 });
}

// LOOP
setInterval(()=>{update();draw();},1000/60);

// START / PAUSE
function startGame(){
 engineSound.play().catch(()=>{});
 running = true;
}

function pauseGame(){
 engineSound.pause();
 running = false;
}
</script>

</body>
</html>
